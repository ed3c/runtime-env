name: Dual-Agent runtime convergence

on:
  pull_request:
    paths:
      - "docs/architecture/dual-agent-runtime/**"
      - ".github/workflows/dual-agent-runtime-convergence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate Stack index
        run: python -m json.tool docs/architecture/dual-agent-runtime/stack-index.json >/dev/null
      - name: Run runtime convergence refusal controls
        run: python docs/architecture/dual-agent-runtime/selftest.py
      - name: Run full repository tests
        run: bash tests/run-all.sh
