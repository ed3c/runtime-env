name: Inception A2 runtime-contract implementation

on:
  push:
    branches: [agent/inception-a2-runtime-contracts]
  pull_request:
    paths:
      - docs/integration/inception-a2-runtime/**
      - contracts/inception-runtime-capability.schema.json
      - modules/inception-agent-runtime.json
      - profiles/inception-agent-local.json
      - workloads/inception-agent-probe.json
      - policies/inception-agent-local.json
      - tests/inception-agent-runtime/**
      - .github/workflows/inception-a2-runtime-contracts.yml

permissions:
  contents: read

jobs:
  deterministic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate exact A2R manifest and lease
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          root = pathlib.Path.cwd()
          manifest = json.loads((root / "docs/integration/inception-a2-runtime/preflight.json").read_text())
          schema = json.loads((root / "contracts/inception-runtime-capability.schema.json").read_text())
          exact = {
              "schema_version": "inception-owner-preflight/v1",
              "atom_id": "INCEPTION-A2R",
              "stage": "OWNER_IMPLEMENTATION",
              "state": "FIRST_IMPLEMENTATION_CANDIDATE",
              "repository": "ed3c/runtime-env",
              "branch": "agent/inception-a2-runtime-contracts",
          }
          for key, value in exact.items():
              assert manifest.get(key) == value, f"DRIFT:{key}"
          base = manifest["base_subject"]
          assert base == {"commit": "c0790b9a8c81d7eb45ed45ac3d761c7fad5baa9b", "tree": "df39f33f7a5278d255a022789b9f94c9b4a073b9"}
          controller = manifest["controller_subject"]
          assert controller["commit"] == "6e0a916fd06dd8635d77c9a8c4d1b475185ea13e"
          assert controller["tree"] == "c3851a6953d456d0342a9776eed28561c1af0ca1"
          assert controller["packet_digest"] == "sha256:18e6a7c89d6f6de322b68fd1c2928fcc6c4cd42508236bb1ca03957435106aec"
          assert manifest["owner_issue"] == "ed3c/runtime-env#67"
          assert manifest["consumer_issue"] == "ed3c/agent-shield-monorepo#153"
          for key in (
              "state_machine", "implementation_subjects", "writable_paths", "read_only_paths",
              "resource_leases", "capability_fields", "required_evidence_lanes",
              "positive_controls", "mutation_controls", "forbidden_actions", "claims_not_proven",
          ):
              values = manifest.get(key)
              assert isinstance(values, list) and values, key
          assert not set(manifest["writable_paths"]) & set(manifest["read_only_paths"])
          assert manifest["cleanup_contract"]["required"] is True
          assert manifest["cleanup_contract"]["rollback_subject"] == base["commit"]
          assert manifest["next_transition"] == "ADD_FIXED_WORKLOAD_PROFILE_POLICY_FIXTURES_AND_CONSUMER_READBACK"
          assert schema["additionalProperties"] is False
          assert schema["properties"]["capabilities"]["properties"]["hidden_reasoning_access"] == {"const": "ABSENT"}

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base['commit']}...HEAD"], text=True
          ).splitlines()
          allowed_exact = {
              "contracts/inception-runtime-capability.schema.json",
              "modules/inception-agent-runtime.json",
              "profiles/inception-agent-local.json",
              "workloads/inception-agent-probe.json",
              "policies/inception-agent-local.json",
              ".github/workflows/inception-a2-runtime-contracts.yml",
          }
          allowed_prefixes = (
              "docs/integration/inception-a2-runtime/",
              "tests/inception-agent-runtime/",
          )
          violations = [
              path for path in changed
              if path not in allowed_exact and not path.startswith(allowed_prefixes)
          ]
          assert not violations, f"PATH_LEASE_VIOLATION:{violations}"
          required = {
              "contracts/inception-runtime-capability.schema.json",
              "tests/inception-agent-runtime/test_contract.py",
          }
          assert required.issubset(set(changed)), "IMPLEMENTATION_SUBJECT_MISSING"
          print(f"PASS atom=INCEPTION-A2R changed={len(changed)} mutations={len(manifest['mutation_controls'])}")
          PY

      - name: Execute runtime contract disagreement controls
        run: |
          python3 tests/inception-agent-runtime/test_contract.py
          python3 -m py_compile tests/inception-agent-runtime/test_contract.py
          python3 -m json.tool contracts/inception-runtime-capability.schema.json >/dev/null

      - name: Run repository deterministic suite
        run: bash tests/run-all.sh

      - name: Check textual patch hygiene
        run: git diff --check
